
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ if not .IsHome}}{{ .Title }} - {{end}}{{ site.Title }}{{ if .IsHome }} - {{ site.Params.Slogan }} {{ end }}</title>

{{ partialCached "css" . }}

<link rel="canonical" href="{{ .Permalink }}">

{{ if .Description }}
    <meta name="description" content="{{ .Description }}">
{{ else }}
    <meta name="description" content="{{ .Summary }}">
{{ end }}

{{ partial "opengraph" . }}

<link rel="me" href="https://nicolasfriedli.ch/">
<link rel="me" href="https://frdl.ch/">
<link rel="me" href="https://ma-paroisse.ch/">
<link rel="me" href="https://github.com/nfriedli/">
<link rel="me" href="https://gravatar.com/nfriedli">
<link rel="me" href="mailto:contact+webmentions@theologique.ch">
<link rel="me" href="https://mastodon.social/@frdlch">
<meta name="fediverse:creator" content="@frdlch@mastodon.social">

<link rel="webmention" href="https://webmention.io/theologique.ch/webmention">
<link rel="pingback" href="https://webmention.io/theologique.ch/xmlrpc">

<link rel="alternate" type="application/rss+xml" href="{{ relURL "index.xml" }}{{- partial "siteversion" . -}}" title="{{ site.Title }}">

<link rel="icon" href="{{ relURL "favicon.ico" }}{{- partial "siteversion" . -}}" sizes="48x48">
<link rel="icon" href="{{ relURL "favicon.svg" }}{{- partial "siteversion" . -}}" type="image/svg+xml" >
<link rel="apple-touch-icon" href="{{ relURL "apple-touch-icon.png" }}{{- partial "siteversion" . -}}" >

<meta name="theme-color" content="#FF9B00" >

{{ if .IsHome }}
    {{ partial "home" . }}
{{ end }}
