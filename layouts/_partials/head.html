
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ if not .IsHome}}{{ .Title }} - {{end}}{{ site.Title }}{{ if .IsHome }} - {{ site.Params.Slogan }} {{ end }}</title>

{{ partialCached "css" . }}

<link rel="canonical" href="{{ .Permalink }}">

{{ if .Description }}
    <meta name="description" content="{{ .Description }}">
{{ else }}
    <meta name="description" content="{{ .Summary }}">
{{ end }}

{{ partial "opengraph" . }}
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<meta name="author" content="Nicolas Friedli">
<meta name="fediverse:creator" content="@frdlch@mastodon.social">

<link rel="alternate" type="application/rss+xml" href="{{ relURL "index.xml" }}" title="{{ site.Title }}">

<link rel="icon" href="{{ relURL "favicon.png" }}">
<link rel="apple-touch-icon" href="{{ relURL "apple-touch-icon.png" }}">

{{ if .IsHome }}
    {{ partial "home" . }}
{{ end }}
