{{ define "main" }}

<h1>{{ .Title }}</h1>

{{ .Content }}

{{ with page.Pages }}
<ul>
{{ range . }}
    <li>
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a><br>
        <time datetime="{{.Date.Format "2006-01-02"}}">{{.Date | time.Format ":date_long" }}</time>
    </li>
{{ end}}
</ul>
{{ end }}

{{ end }}
