
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ if not .IsHome}}{{ .Title }} - {{end}}{{ site.Title }}{{ if .IsHome }} - {{ site.Params.Slogan }} {{ end }}</title>

{{ partialCached "css" . }}

<link rel="canonical" href="{{ .Permalink }}">

{{ if .Description }}
    <meta name="description" content="{{ .Description }}">
{{ else }}
    <meta name="description" content="{{ .Summary }}">
{{ end }}

{{ partial "opengraph" . }}

<meta name="fediverse:creator" content="@frdlch@mastodon.social">

<link rel="alternate" type="application/rss+xml" href="{{ relURL "index.xml" }}" title="{{ site.Title }}">

<link rel="icon" href="{{ relURL "favicon.png" }}">
<link rel="apple-touch-icon" href="{{ relURL "apple-touch-icon.png" }}">


<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-UyrdbSEpQnlN3K-GasK1i.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
{{ if eq .Kind "404" }}
    <script>document.addEventListener("DOMContentLoaded", function () { plausible("404"); });</script>
{{ end }}

{{ if .IsHome }}
    {{ partial "home" . }}
{{ end }}
