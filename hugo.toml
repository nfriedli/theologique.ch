baseURL = "https://theologique.ch/"
title = "theologique.ch"

locale = "fr"

copyright = "Creative Commons BY-SA"

disableKinds = ["robotstxt", "taxonomy", "term"]
noBuildLock = true
summaryLength = 30

enableGitInfo = true
enableEmoji = true

[frontmatter]
date = ["date", ":filename", ":git"]
lastmod = ["lastmod", "date", ":git"]

[markup]
[markup.goldmark.parser]
autoHeadingIDType = "github-ascii"

[markup.highlight]
noClasses = false

[minify]
minifyOutput = true

[minify.tdewolff.html]
keepDefaultAttrVals = false
keepEndTags = true
keepQuotes = true
keepWhitespace = true

[params]
images = [ "/images/opengraph.jpg" ]
slogan = "web, théologie & persiflages"

[params.author]
name = "Nicolas Friedli"
email = "contact+rss@theologique.ch"

[services]
[services.rss]
limit = 10