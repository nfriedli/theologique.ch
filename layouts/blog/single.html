{{ define "main" }}
<article class="h-entry">
    <header>
        <h1 class="p-name">{{ .Title }}</h1>
        <time class="dt-published" datetime="{{.Date.Format " 2006-01-02"}}">
            {{.Date | time.Format ":date_long"}}
            {{ if gt .Lastmod .Date }}
                - modification: <span class="dt-updated">{{.Lastmod | time.Format ":date_long"}}</span>
            {{ end }}
        </time>
    </header>
    {{ partial "toc" . }}
    <div class="e-content">
        {{ .Content }}
    </div>
</article>
{{ end }}


{{ define "json-ld" }}
{{- $ISO8601 := "2006-01-02T15:04:05-07:00" }}

<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{ .Title }}",
    "wordCount": "{{ .WordCount }}",
    {{ with .Date }}
        "datePublished": "{{ .Format $ISO8601 }}",
    {{ end }}
    {{ with .Lastmod }}
    "dateModified": "{{ .Format $ISO8601 }}",
    {{ end }}
    "author": [{
        "@type": "Person",
        "name": "Nicolas Friedli",
        "url": "https://nicolasfriedli.ch/"
    }],
    "isAccessibleForFree": true
    {{- with partial "_funcs/get-page-images" . }}{{- range . | first 1 }},"image":"{{.Permalink}}"{{- end }}{{- end }}
}
</script>
{{ end }}
