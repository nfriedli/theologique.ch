
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ if not .IsHome}}{{ .Title }} - {{end}}{{ site.Title }}{{ if .IsHome }} - {{ site.Params.Slogan }} {{ end }}</title>

{{ partialCached "css" . }}

<link rel="canonical" href="{{ .Permalink }}">

{{ if .Description }}
    <meta name="description" content="{{ .Description }}">
{{ else }}
    <meta name="description" content="{{ .Summary }}">
{{ end }}

{{ partial "opengraph" . }}

<meta name="fediverse:creator" content="@frdlch@mastodon.social">

<link rel="webmention" href="https://webmention.io/theologique.ch/webmention">
<link rel="pingback" href="https://webmention.io/theologique.ch/xmlrpc">

<link rel="alternate" type="application/rss+xml" href="{{ relURL "index.xml" }}" title="{{ site.Title }}">

<link rel="icon" type="image/png" href="{{ relURL "favicon-96x96.png" }}" sizes="96x96">
<link rel="shortcut icon" href="{{ relURL "favicon.ico" }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ relURL "apple-touch-icon.png" }}">
<link rel="manifest" href="{{ relURL "site.webmanifest" }}">

<meta name="theme-color" content="#FF9B00">

<link rel="human-json" href="/human.json">

{{ if .IsHome }}
    {{ partial "home" . }}
{{ end }}

<script async src="https://plausible.io/js/pa-8AH75UR1aB2SFRK8xbiD_.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
{{ if eq .Kind "404" }}
    <script>document.addEventListener("DOMContentLoaded", function () { plausible("404"); });</script>
{{ end }}
